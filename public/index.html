<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Cursor 移动桥接</title>
  <link rel="stylesheet" href="/style.css?v=16">
</head>
<body>
  <!-- 工作空间文件浏览器：窄屏全屏抽屉；宽屏固定左侧侧栏 -->
  <aside id="fileExplorer" class="file-explorer" aria-label="工作空间文件">
    <div class="file-explorer-header">
      <span id="fileExplorerTitle" class="file-explorer-title">文件</span>
      <button id="btnCloseFileExplorer" class="btn-icon file-explorer-close" type="button" aria-label="关闭文件浏览" title="关闭">×</button>
    </div>
    <div class="file-explorer-path-bar" id="fileExplorerPathBar">
      <button id="btnFileExplorerUp" class="btn-icon" type="button" title="上一级" disabled>↑</button>
      <span id="fileExplorerPath" class="file-explorer-path">/</span>
    </div>
    <div id="fileExplorerList" class="file-explorer-list" role="listbox" aria-label="文件列表">
      <div class="file-explorer-loading">加载中...</div>
    </div>
  </aside>
  <div id="fileExplorerBackdrop" class="file-explorer-backdrop" aria-hidden="true"></div>

  <!-- 中间：文件预览（宽屏常驻；窄屏在文件抽屉内全屏覆盖） -->
  <section id="editorPane" class="editor-pane" aria-label="文件视图">
    <div id="editorPaneEmpty" class="editor-pane-empty">选择左侧文件以预览</div>
    <div id="filePreviewPane" class="file-preview-pane hidden" aria-hidden="true">
      <div class="file-preview-header">
        <button id="btnFilePreviewBack" class="btn-icon" type="button" aria-label="返回文件列表" title="返回">←</button>
        <span id="filePreviewTitle" class="file-preview-title"></span>
      </div>
      <div id="filePreviewBody" class="file-preview-body"></div>
    </div>
  </section>

  <!-- 聊天区（宽屏为右侧侧栏） -->
  <div id="chatPanel" class="chat-panel">
  <header id="toolbar">
    <div class="toolbar-row">
      <button id="btnToggleFileExplorer" class="btn-icon btn-toggle-explorer" type="button" title="文件浏览" aria-label="打开文件浏览">
        <svg class="btn-toggle-explorer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M3 7h18M3 12h18M3 17h18"/>
        </svg>
      </button>
      <button id="btnPickWorkspace" class="btn-workspace" title="选择工作空间">
        <span class="workspace-icon">📁</span>
        <span class="workspace-label" id="workspaceLabel">workspace</span>
      </button>
      <nav id="turnNav" class="toolbar-turn-nav hidden" aria-label="对话导航">
        <button
          id="btnNavTurnUp"
          class="btn-icon turn-nav-btn"
          type="button"
          aria-label="上一条用户对话"
          title="上一条对话"
        >
          <svg class="turn-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 19V5M6 11l6-6 6 6"/>
          </svg>
        </button>
        <button
          id="btnNavTurnDown"
          class="btn-icon turn-nav-btn"
          type="button"
          aria-label="下一条用户对话"
          title="下一条对话"
        >
          <svg class="turn-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 5v14M6 13l6 6 6-6"/>
          </svg>
        </button>
      </nav>
      <button id="btnNewSession" class="btn-icon" title="新会话">+</button>
    </div>
    <div class="status-bar" id="statusBar">连接中...</div>
  </header>

  <!-- 消息列表 -->
  <main id="messages" role="log" aria-live="polite"></main>

  <!-- 一键滚底（上滑查看历史时显示） -->
  <button
    id="btnScrollBottom"
    class="btn-scroll-bottom hidden"
    type="button"
    aria-label="滚动到底部"
    title="滚到底部"
  >
    <svg class="btn-scroll-bottom-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M12 5v14M6 13l6 6 6-6"/>
    </svg>
  </button>

  <!-- 底部输入区 -->
  <footer id="inputArea">
    <div id="agentWorkStatus" class="agent-work-status hidden" aria-live="polite">
      <span id="agentElapsedText">用时 0 秒</span>
    </div>
    <div class="input-selects-row">
      <select id="selectMode" aria-label="Agent 模式">
        <option value="agent">Agent</option>
        <option value="plan">Plan</option>
        <option value="ask">Ask</option>
      </select>
      <select id="selectModel" aria-label="模型">
        <option value="">加载中...</option>
      </select>
    </div>
    <div id="imagePreviewBar" class="image-preview-bar hidden" aria-label="待发送图片"></div>
    <div class="input-row">
      <input
        type="file"
        id="inputImage"
        accept="image/*"
        multiple
        hidden
        aria-hidden="true"
      >
      <button id="btnPickImage" class="btn-pick-image" type="button" aria-label="插入图片" title="插入图片">
        <svg class="btn-pick-image-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" ry="2"/>
          <circle cx="8.5" cy="10.5" r="1.5" fill="currentColor" stroke="none"/>
          <path d="M21 16l-5.5-5.5a1.5 1.5 0 00-2.12 0L3 19"/>
        </svg>
      </button>
      <textarea
        id="inputText"
        rows="1"
        placeholder="输入消息..."
        aria-label="消息输入"
      ></textarea>
      <button id="btnSend" class="btn-send" aria-label="发送">发送</button>
      <button id="btnCancel" class="btn-send btn-cancel hidden" aria-label="取消">取消</button>
    </div>
  </footer>
  </div>

  <!-- ask_question 弹窗 -->
  <div id="askModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h3 id="askTitle">请选择</h3>
      <div id="askQuestions"></div>
      <div class="modal-actions">
        <button id="btnAskSkip" class="btn-secondary">跳过</button>
        <button id="btnAskSubmit" class="btn-primary">确认</button>
      </div>
    </div>
  </div>

  <!-- 工作空间选择弹窗 -->
  <div id="workspaceModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content workspace-modal-content">
      <h3>选择工作空间</h3>
      <div class="workspace-path-bar">
        <button id="btnDirUp" class="btn-icon" title="上一级" disabled>↑</button>
        <span id="workspaceCurrentPath" class="workspace-current-path">加载中...</span>
      </div>
      <div id="workspaceDirList" class="workspace-dir-list" role="listbox" aria-label="文件夹列表"></div>
      <div class="modal-actions">
        <button id="btnWorkspaceCancel" class="btn-secondary">取消</button>
        <button id="btnWorkspaceSelect" class="btn-primary">选择此文件夹</button>
      </div>
    </div>
  </div>

  <script src="/app.js?v=24"></script>
</body>
</html>
